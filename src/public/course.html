<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EnrollmentNow | Course</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; }
    .ok { color: #11692b; } .err { color: #a11a1a; }
    dialog { border: 1px solid #888; border-radius: 8px; padding: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <p id="who"></p>
    <button id="logout" type="button">Log out</button>

    <h1 id="title">Loading course...</h1>
    <p data-testid="seat-count" id="seats"></p>

    <button id="register" type="button">Register</button>
    <!-- only shows when the course is full -->
    <button id="join-waitlist" type="button" hidden>Join waitlist</button>

    <p id="reg-status">Registration status: Not registered</p>
    <!-- result message -->
    <p role="status" id="message"></p>
  </main>

  <dialog id="confirm" aria-labelledby="confirm-heading">
    <h2 id="confirm-heading">Confirm registration</h2>
    <p id="confirm-text"></p>
    <button id="confirm-yes" type="button">Confirm</button>
    <button id="confirm-no" type="button">Cancel</button>
  </dialog>

  <script>
    const code = decodeURIComponent(location.pathname.split("/").pop());
    const $ = (id) => document.getElementById(id);

    // not logged in -> go to login
    let studentId = null;
    async function loadStudent() {
      const res = await fetch("/api/me");
      if (!res.ok) {
        location.href = `/login?next=${encodeURIComponent(location.pathname)}`;
        return false;
      }
      const me = await res.json();
      studentId = me.studentId;
      $("who").textContent = `Logged in as ${me.name} (Student ID ${me.studentId})`;
      return true;
    }

    $("logout").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      location.href = `/login?next=${encodeURIComponent(location.pathname)}`;
    });

    async function loadCourse() {
      const res = await fetch(`/api/courses/${encodeURIComponent(code)}`);
      if (!res.ok) { $("title").textContent = "Course not found"; return; }
      const c = await res.json();
      $("title").textContent = `${c.code}: ${c.title}`;
      $("seats").textContent = c.seatLabel;
    }

    $("register").addEventListener("click", () => {
      $("confirm-text").textContent = `Register for ${code}?`;
      $("confirm").showModal();
    });
    $("confirm-no").addEventListener("click", () => $("confirm").close());

    $("confirm-yes").addEventListener("click", async () => {
      $("confirm").close();
      const res = await fetch("/api/registrations", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ studentId, courseCode: code }),
      });
      const body = await res.json();
      $("message").textContent = body.message;
      $("message").className = res.ok ? "ok" : "err";
      // show waitlist button if full
      $("join-waitlist").hidden = !body.canJoinWaitlist;
      if (res.ok) {
        $("seats").textContent = body.seatLabel;
        $("reg-status").textContent = "Registration status: Registered";
        $("register").disabled = true;
      }
    });

    $("join-waitlist").addEventListener("click", async () => {
      const res = await fetch("/api/waitlist", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ studentId, courseCode: code }),
      });
      const body = await res.json();
      $("message").textContent = body.message;
      $("message").className = res.ok ? "ok" : "err";
      if (res.ok) {
        $("reg-status").textContent = `Registration status: Waitlisted (position ${body.position})`;
        $("join-waitlist").hidden = true;
        $("register").disabled = true;
      }
    });

    loadStudent().then((ok) => { if (ok) loadCourse(); });
  </script>
</body>
</html>
